<!DOCTYPE html>
<html>
<head>
    <title>QR Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .camera-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .video-box {
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #0f172a;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .video-box img { display: block; }
        .badge {
            background: #eff6ff;
            border: 1px solid #93c5fd;
            color: #1e40af;
            padding: 8px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="main">
    <div class="sidebar">
        <h2>🎓 AttendAI</h2>
        <a href="/dashboard">Dashboard</a>
        <a href="/camera">📷 Camera</a>
        <a href="/qr" style="background:#1e293b; color:white;">📱 QR Scanner</a>
        <a href="/download">Download CSV</a>
        <a href="/logout" style="margin-top:20px; color:#f87171;">Logout</a>
    </div>

    <div class="content">
        <div class="camera-wrap">
            <h1>📱 QR Attendance Scanner</h1>
            <p class="badge">🔵 Point a student QR code at the camera</p>

            <div class="video-box">
                <img src="/qr_video" width="700">
            </div>

            <a href="/dashboard">
                <button class="btn primary">⬅ Back to Dashboard</button>
            </a>
        </div>
    </div>
</div>

</body>
</html>
